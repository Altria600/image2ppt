# Copy to ~/.image2ppt/config.yaml and fill secrets locally.
# On Linux/macOS: chmod 600 ~/.image2ppt/config.yaml

# One Baidu AI Studio Access Token, not an API Key/Secret Key pair.
# Apply at https://aistudio.baidu.com/account/accessToken
PADDLE_OCR_TOKEN: ""

# Optional image-generation API fallback. Leave empty when using the agent image
# tool or Codex OAuth.
# OPENAI_API_KEY: ""
# OPENAI_BASE_URL: "https://api.openai.com/v1"
# IMAGE2PPT_IMAGE_MODEL: "gpt-image-2"
