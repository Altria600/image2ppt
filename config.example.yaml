# Copy to config.yaml for local use. Never commit config.yaml or real secrets.
# The default image route is local-only; these fields are read only after the
# corresponding backend or --allow-remote-ocr option is selected explicitly.

# Remote OCR is opt-in. A token alone never authorizes an OCR upload.
PADDLE_OCR_TOKEN: ""

# Explicit OpenAI Images-compatible API route. The endpoint must implement the
# protocol, regardless of provider or model naming. Keep credentials local.
# OPENAI_API_KEY: ""
# OPENAI_BASE_URL: "https://api.example/v1"
# IMAGE2PPT_IMAGE_BACKEND: "openai-compatible-api"
# IMAGE2PPT_IMAGE_MODEL: "provider-model-id"
# IMAGE2PPT_IMAGE_USER_AGENT: ""

# Optional defaults for a host-provided image tool. The host must expose these
# exact names; Image2PPT never infers them from another application's config.
# IMAGE2PPT_HOST_TOOL_NAME: ""
# IMAGE2PPT_HOST_TOOL_CALL: ""
