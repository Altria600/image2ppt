name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out Image2PPT
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes libreoffice-impress fonts-noto-cjk imagemagick

      - name: Install bundled dependencies and CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --editable cli

      - name: Run unit and isolation tests
        run: python -m unittest discover -s tests -v

      - name: Run independent preflight
        run: python cli/image2ppt/cli.py doctor --json

      - name: Check whitespace
        run: |
          if git grep -nE '[[:blank:]]+$' -- '*.py' '*.md' '*.yaml' '*.yml' '*.txt'; then
            exit 1
          fi
